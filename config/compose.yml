volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai-hrms-app:
    driver: bridge

services:
  # ============================================================
  # POSTGRES (Production Ready)
  # ============================================================
  postgres:
    image: postgres:18-alpine
    env_file: 
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # POSTGRES_DB has been removed. The database names (screening_db and hrms_db)
      # are now created by the init_dbs.sh script located in the mounted volume.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-config/init:/docker-entrypoint-initdb.d # This volume ensures init_dbs.sh runs
      - ./postgres-config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres-config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - ai-hrms-app
    healthcheck:
      # Healthcheck simplified to check readiness using the user/password,
      # without specifying a single application database name.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # REDIS (Production Ready)
  # ============================================================
  redis:
    image: redis:alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis-config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai-hrms-app
    restart: unless-stopped