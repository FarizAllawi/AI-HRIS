# Security Hardening Configuration
# Additional security measures and restrictions

# Block common attacks
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Block all requests to unknown hosts
    return 444;
}

# Rate limiting for brute force protection
geo $limit {
    default 1;
    10.0.0.0/8 0;
    172.16.0.0/12 0;
    192.168.0.0/16 0;
}

map $limit $limit_key {
    0 "";
    1 $binary_remote_addr;
}

limit_req_zone $limit_key zone=security:10m rate=10r/m;

# Block bad bots and scanners
map $http_user_agent $bad_bot {
    default 0;
    ~*(googlebot|bingbot|YandexBot) 1;
    ~*(mj12bot|ahrefs|semrush) 1;
    ~*(curl|wget|python|java) 0; # Allow common tools
    ~*(scan|hack|crawl|spider) 1;
}

# Block requests based on user agent
server {
    listen 80;
    server_name _;

    if ($bad_bot) {
        return 444;
    }

    location / {
        return 444;
    }
}

# API Security headers
server {
    listen 80;
    server_name api-security.yourdomain.com;

    # Security headers only - no content
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    location / {
        return 200 '{"status": "secure"}';
        default_type application/json;
    }
}
