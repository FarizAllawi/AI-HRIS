server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:
    jaeger:
      protocols:
        thrift_compact:
        thrift_binary:
        grpc:
        http:
    zipkin:
    opencensus:

ingester:
  max_block_duration: 5m               # Cut the headblock when this much time passes
  trace_idle_period: 10s               # Close a trace if no spans received for this long
  max_block_bytes: 1_000_000           # Close the headblock when it reaches this size

compactor:
  compaction:
    compaction_window: 1h               # Blocks in this time window will be compacted together
    max_block_bytes: 100_000_000        # Maximum size of a compacted block
    block_retention: 24h                # How long to keep blocks
    compacted_block_retention: 1h       # How long to keep compacted blocks

storage:
  trace:
    backend: local                     # Backend configuration to use
    block:
      bloom_filter_false_positive: .05 # Bloom filter false positive rate
      index_downsample_bytes: 1000     # Number of bytes per index record
      encoding: zstd                   # Block encoding
    wal:
      path: /tmp/tempo/wal             # Where to store the wal locally
      encoding: snappy                 # Wal encoding
    local:
      path: /tmp/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: ai-screening-production
  storage:
    path: /tmp/tempo/generator/wal
  traces_storage:
    path: /tmp/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.5e9

querier:
  max_concurrent_queries: 20
  search:
    query_timeout: 30s
    duration_slo: 5s

compactor:
  compaction:
    chunk_size_bytes: 5000000
    flush_size_bytes: 10000000
    iterator_buffer_size: 1000
    max_block_bytes: 1073741824
    max_compaction_objects: 1000000
    max_time_per_block: 1h
    block_retention: 24h
    compacted_block_retention: 1h

memberlist:
  join_members:
    - tempo-cluster

# Configuration for span metrics
spanmetrics:
  latency_histogram_buckets: [2ms, 4ms, 6ms, 8ms, 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
  dimensions: ["service", "span_name", "span_kind", "status_code"]
  dimensions_cache_size: 1000
  aggregation_duration: 10s

# Configuration for service graphs
service_graphs:
  wait: 10s
  max_items: 10000
  workers: 10
  bucket_size: 10s
  histogram_buckets: [2ms, 4ms, 6ms, 8ms, 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]

# Tempo query configuration
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# Multi-tenancy (disabled for single-tenant)
multitenancy_enabled: false
