version: "3.9"

services:
  hrms:
    container_name: hrms-prod
    restart: always
    ports:
      - "80:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - ./hrms-app/src:/var/www/html:ro  # read-only for safety

  ai-service:
    container_name: ai-service-prod
    restart: always
    ports:
      - "8100:8100"
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8100
    environment:
      MODE: production
    volumes:
      - ./ai-service/src:/app:ro

  celery-worker:
    build: ./ai-service
    container_name: celery-worker-prod
    command: celery -A celery_app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./ai-service/src:/app:ro
    restart: always
    depends_on:
      - redis
    networks:
      - backend

  redis:
    container_name: redis-prod
    restart: always

  # postgres:
  #   container_name: postgres-prod
  #   restart: always
