[project]
name = "AI-Service"
version = "0.1.0"
description = "AI Screening service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.10.1",
    "pytest>=8.4.1",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.42",
    "uvicorn>=0.37.0",
    "celery>=5.5.3",
    "redis>=6.4.0",
    "pandas>=2.3.3",
    "python-multipart>=0.0.20",
    "transformers>=4.57.1",
    "sentence-transformers>=5.1.1",
]

[tool.pytest.ini_options]
pythonpath = "."