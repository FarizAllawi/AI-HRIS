services:
  # FastAPI App
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: fastapi-dev
    ports:
      - "8100:8100"
    env_file:
      - .env
    environment:
      GATEWAY_BASE_URL: http://192.168.247.37:8000
      OAUTH_CLIENT_ID: 019a8469-f263-7353-aa3a-bd7684162890
      OAUTH_CLIENT_SECRET: RT7BTFF9tgZEq3vhThRQ0pt5ZvwIcA8dw2RjCgXh
      OAUTH_TOKEN_SCOPE: "ai-service:*"
      # Use redis-server consistently
      REDIS_URL: redis://redis-server:6379/0
      CELERY_BROKER_URL: redis://redis-server:6379/0
      CELERY_RESULT_BACKEND: redis://redis-server:6379/0
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
      - ./uploads:/app/uploads
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
            - data/
            - uploads/
            - keys/
        - action: rebuild
          path: ./pyproject.toml
    depends_on:
      - redis
    networks:
      - backend

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: celery
    container_name: screening-celery
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONPATH: /app
      # Use redis-server consistently
      REDIS_URL: redis://redis-server:6379/0
      CELERY_BROKER_URL: redis://redis-server:6379/0
      CELERY_RESULT_BACKEND: redis://redis-server:6379/0
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
      - ./uploads:/app/uploads
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
            - data/
            - uploads/
            - keys/
        - action: rebuild
          path: ./pyproject.toml
    depends_on:
      - redis
    networks:
      - backend
    restart: unless-stopped

  # Celery Flower
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: flower
    container_name: screening-flower
    ports:
      - "5555:5555"
    environment:
      # Use redis-server consistently
      CELERY_BROKER_URL: redis://redis-server:6379/0
      CELERY_RESULT_BACKEND: redis://redis-server:6379/0
    depends_on:
      - redis
      - celery-worker
    networks:
      - backend
    restart: unless-stopped

  # Redis
  redis:
    image: redis:alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  redis_data:
