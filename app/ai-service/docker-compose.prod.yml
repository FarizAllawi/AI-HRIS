version: "3.9"

services:
  # ============================================================
  # POSTGRES (Production Ready)
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: fastapi-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-screening_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres-config/init:/docker-entrypoint-initdb.d
      - ./deployment/postgres-config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./deployment/postgres-config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-screening_db}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # REDIS (Production Ready)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: fastapi-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./deployment/redis-config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  # ============================================================
  # FASTAPI APP (Production)
  # ============================================================
  web:
    build:
      context: .
      dockerfile: production.Dockerfile
      target: web
    container_name: fastapi-web-prod
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-screening_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
      ENVIRONMENT: production
      LOG_LEVEL: INFO

    ports:
      - "8100:8100"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - app_data:/app/data
      - app_uploads:/app/uploads
      - app_keys:/app/keys
      - app_logs:/app/logs

    networks:
      - backend
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # CELERY WORKER
  # ============================================================
  celery-worker:
    build:
      context: .
      dockerfile: production.Dockerfile
      target: worker
    container_name: screening-celery-worker-prod
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-screening_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
      ENVIRONMENT: production
      LOG_LEVEL: INFO

      CELERY_WORKER_MAX_TASKS_PER_CHILD: 1000
      CELERY_WORKER_PREFETCH_MULTIPLIER: 1

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - app_data:/app/data
      - app_keys:/app/keys
      - app_logs:/app/logs

    networks:
      - backend
    restart: unless-stopped

  # ============================================================
  # CELERY BEAT
  # ============================================================
  celery-beat:
    build:
      context: .
      dockerfile: production.Dockerfile
      target: beat
    container_name: screening-celery-beat-prod
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-screening_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
      ENVIRONMENT: production
      LOG_LEVEL: INFO

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - app_data:/app/data
      - app_keys:/app/keys
      - app_logs:/app/logs

    networks:
      - backend
    restart: unless-stopped

  # ============================================================
  # FLOWER (Celery Monitoring)
  # ============================================================
  flower:
    build:
      context: .
      dockerfile: production.Dockerfile
      target: flower
    container_name: flower-monitor-prod
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD}

    volumes:
      - app_logs:/app/logs

    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

    ports:
      - "5555:5555"

    networks:
      - backend
    restart: unless-stopped

# ============================================================
# NETWORKS & VOLUMES
# ============================================================
networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_data:
    driver: local
  app_uploads:
    driver: local
  app_keys:
    driver: local
  app_logs:
    driver: local
