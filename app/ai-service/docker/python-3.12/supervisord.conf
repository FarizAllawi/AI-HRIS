[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:ai-service]
process_name=%(program_name)s
command=uvicorn app.main:app --host 0.0.0.0 --port 8100 --log-level info
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=nonroot
numprocs=1
redirect_stderr=true
stdout_logfile=/app/logs/fastapi.log
stopwaitsecs=60

[program:celery-worker]
process_name=%(program_name)s
command=celery -A app.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=1000 --prefetch-multiplier=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=nonroot
numprocs=1
redirect_stderr=true
stdout_logfile=/app/logs/worker.log
stopwaitsecs=60

[program:celery-beat]
process_name=%(program_name)s
command=celery -A app.celery_app beat --loglevel=info
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=nonroot
numprocs=1
redirect_stderr=true
stdout_logfile=/app/logs/beat.log
stopwaitsecs=60

[program:flower]
process_name=%(program_name)s
command=celery -A app.celery_app flower --port=5555
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=nonroot
numprocs=1
redirect_stderr=true
stdout_logfile=/app/logs/flower.log
stopwaitsecs=60
