# THIS COMPOSE FILE ONLY CREATE SERVICE HRMS-APP AND
# MUST BE INCLUDED IN OTHER COMPOSE FILE:
#  - docker-compose.dev.yml
#  - docker-compose.test.yml
#  - app/ai-service/docker.compose.yml
services:
  hrms-app:
    build:
      context: .
      dockerfile: docker/php-8.4/Dockerfile
      target: prod
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
        WWWUSER: '${WWWUSER:-1337}'
    env_file:
      - .env
      - ../../config/.env # Overide the project environment variables
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${HRMS_APP_PORT:-80}:80'
      - '${HRMS_APP_VITE_PORT:-5173}:5173'
    environment:
      WWWUSER: '${WWWUSER:-1337}'
      WWWGROUP: '${WWWGROUP:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
      APP_ENV: '${HRMS_APP_ENV:-production}'
      DB_CONNECTION: '${DB_CONNECTION}'
      DB_HOST: '${DB_HOST}'
      DB_PORT: '${DB_PORT}'
      DB_DATABASE: '${DB_DATABASE}'
      DB_USERNAME: '${DB_USERNAME}'
      DB_PASSWORD: '${DB_PASSWORD}'
    networks:
      - ai-hrms-app
    volumes:
      - ../../docker/shared:/var/www/html/storage/shared
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
      interval: 60s
      timeout: 5s
      retries: 100
      start_period: 60s
    depends_on:
      # Ensure these match the service names in root docker/compose.yml
      # If pgsql/redis are defined in the root, these depends_on will work
      # because they share the same network and project context.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  ai-hrms-app:
    driver: bridge
