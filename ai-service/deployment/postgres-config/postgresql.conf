# Docker-optimized production postgresql.conf (final)

data_directory = '/var/lib/postgresql/data'
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'
external_pid_file = '/var/run/postgresql/postgresql.pid'

listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3

authentication_timeout = 1min
password_encryption = scram-sha-256

# Memory / resources
shared_buffers = 256MB
huge_pages = try
temp_buffers = 8MB
work_mem = 4MB
maintenance_work_mem = 64MB
autovacuum_work_mem = -1
dynamic_shared_memory_type = posix

temp_file_limit = 1GB
max_files_per_process = 1000

# WAL & durability
wal_level = replica
fsync = on
synchronous_commit = on
wal_sync_method = fsync
full_page_writes = on
wal_compression = on
wal_log_hints = off

checkpoint_timeout = 5min
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.7

# Simple WAL archive to mounted volume
archive_mode = off
# archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_command = ''
archive_timeout = 60

# Query planner / tuning
enable_bitmapscan = on
enable_hashagg = on
enable_hashjoin = on
enable_indexscan = on
enable_indexonlyscan = on
enable_material = on
enable_mergejoin = on
enable_nestloop = on
enable_seqscan = on
enable_sort = on
enable_tidscan = on

seq_page_cost = 1.0
random_page_cost = 1.1
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

geqo = on
geqo_threshold = 12

default_statistics_target = 100

# Logging -> Docker-friendly (stdout)
log_destination = 'stderr'
logging_collector = off
# log_directory is ignored when logging_collector = off

log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_error_verbosity = default
log_lock_waits = on
log_statement = 'none'
log_timezone = 'UTC'

# Stats & autovacuum
track_activities = on
track_counts = on
track_io_timing = on
track_functions = none
track_activity_query_size = 1024

log_temp_files = 100MB
log_autovacuum_min_duration = 1000ms

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1
autovacuum_freeze_max_age = 200000000
autovacuum_vacuum_cost_delay = 20ms
autovacuum_vacuum_cost_limit = 200

# Client defaults and timeouts
default_transaction_isolation = 'read committed'
default_transaction_read_only = off
statement_timeout = 30000
lock_timeout = 30000
idle_in_transaction_session_timeout = 60000

TimeZone = 'UTC'
client_encoding = utf8

# Parallel / JIT
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2
effective_io_concurrency = 200

jit = on
jit_above_cost = 100000
jit_optimize_above_cost = 500000
jit_inline_above_cost = 500000
