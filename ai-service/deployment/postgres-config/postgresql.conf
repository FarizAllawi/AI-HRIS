#------------------------------------------------------------------------------
# POSTGRESQL PRODUCTION CONFIGURATION
#------------------------------------------------------------------------------

#------------------------------------------------------------------------------
# FILE LOCATIONS
#------------------------------------------------------------------------------

data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'
external_pid_file = '/var/run/postgresql/postgresql.pid'

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

# Connection Settings
listen_addresses = '*'		# Listen on all interfaces
port = 5432				# Default port
max_connections = 100		# Reasonable for screening app
superuser_reserved_connections = 3

# Authentication
authentication_timeout = 1min	# 1 minute timeout
password_encryption = scram-sha-256

# SSL (Uncomment and configure if using SSL)
# ssl = on
# ssl_cert_file = '/ssl/server.crt'
# ssl_key_file = '/ssl/server.key'
# ssl_ca_file = '/ssl/ca.crt'

#------------------------------------------------------------------------------
# RESOURCE USAGE
#------------------------------------------------------------------------------

# Memory
shared_buffers = 256MB			# 25% of available RAM (1GB system)
huge_pages = try				# Use huge pages if available
temp_buffers = 8MB				# Per-session temporary buffers
work_mem = 4MB					# Reasonable for screening operations
maintenance_work_mem = 64MB		# For VACUUM, CREATE INDEX, etc.
autovacuum_work_mem = -1		# Use maintenance_work_mem
dynamic_shared_memory_type = posix	# Most compatible

# Disk
temp_file_limit = 1GB			# Maximum temporary file size

# Kernel Resource Usage
max_files_per_process = 1000	# Maximum open files
shared_preload_libraries = ''	# Add 'pg_stat_statements' for monitoring

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG
#------------------------------------------------------------------------------

wal_level = replica			# Needed for replication
fsync = on				# Crucial for data integrity
synchronous_commit = on		# Full ACID compliance
wal_sync_method = fsync		# Most reliable
full_page_writes = on		# Prevent page corruption
wal_compression = on		# Reduce WAL volume
wal_log_hints = off

# Checkpoints
checkpoint_timeout = 5min		# Time between checkpoints
max_wal_size = 1GB			# Maximum WAL size
min_wal_size = 80MB			# Minimum WAL size
checkpoint_completion_target = 0.7	# Spread checkpoint I/O

# Archive Mode (Uncomment for backups)
# archive_mode = on
# archive_command = 'test ! -f /var/lib/postgresql/backup_in_progress || (test ! -f /var/lib/postgresql/wal/%f && cp %p /var/lib/postgresql/wal/%f)'

#------------------------------------------------------------------------------
# REPLICATION
#------------------------------------------------------------------------------

max_wal_senders = 0		# No replication in single instance
wal_keep_size = 0		# No WAL retention for replication
hot_standby = off		# No standby servers

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------

# Planner Method Configuration
enable_bitmapscan = on
enable_hashagg = on
enable_hashjoin = on
enable_indexscan = on
enable_indexonlyscan = on
enable_material = on
enable_mergejoin = on
enable_nestloop = on
enable_seqscan = on
enable_sort = on
enable_tidscan = on

# Planner Cost Constants
seq_page_cost = 1.0			# Default cost for sequential page fetch
random_page_cost = 4.0		# Higher for SSD, lower for RAM disk
cpu_tuple_cost = 0.01		# Cost of processing a tuple
cpu_index_tuple_cost = 0.005	# Cost of processing an index tuple
cpu_operator_cost = 0.0025	# Cost of executing an operator

# Genetic Query Optimizer
geqo = on
geqo_threshold = 12

# Other Planner Options
default_statistics_target = 100	# Better statistics for query planning
constraint_exclusion = partition	# Only for partitioned tables

#------------------------------------------------------------------------------
# REPORTING AND LOGGING
#------------------------------------------------------------------------------

# Where to Log
log_destination = 'stderr'
logging_collector = on		# Enable capturing stderr to log files
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_rotation_age = 1d		# Rotate logs daily
log_rotation_size = 100MB	# Or rotate when reaching 100MB
log_truncate_on_rotation = on

# What to Log
log_line_prefix = '%m [%p] %q%u@%d '	# Timestamp, process ID, user, database
log_checkpoints = on
log_connections = on			# Log connection attempts
log_disconnections = on			# Log disconnections
log_duration = off				# Don't log query duration (performance)
log_error_verbosity = default		# terse, default, or verbose
log_hostname = off
log_lock_waits = on			# Log long lock waits
log_statement = 'none'			# Don't log queries (security/performance)
log_replication_commands = off
log_timezone = 'UTC'

#------------------------------------------------------------------------------
# RUNTIME STATISTICS
#------------------------------------------------------------------------------

# Query and Index Statistics Collector
track_activities = on
track_counts = on
track_io_timing = on			# I/O timing statistics
track_functions = none			# Don't track function calls
track_activity_query_size = 1024	# Size of query text in pg_stat_activity

# Statistics Monitoring
log_temp_files = 100MB		# Log temp files larger than 100MB
log_autovacuum_min_duration = 1000ms	# Log long autovacuum runs

#------------------------------------------------------------------------------
# AUTOVACUUM PARAMETERS
#------------------------------------------------------------------------------

autovacuum = on			# Enable autovacuum
log_autovacuum_min_duration = 1000ms	# Log long autovacuum runs
autovacuum_max_workers = 3		# Maximum autovacuum processes
autovacuum_naptime = 1min		# Time between autovacuum runs
autovacuum_vacuum_threshold = 50	# Min number of row updates before vacuum
autovacuum_analyze_threshold = 50	# Min number of row updates before analyze
autovacuum_vacuum_scale_factor = 0.2	# Fraction of table size before vacuum
autovacuum_analyze_scale_factor = 0.1	# Fraction of table size before analyze
autovacuum_freeze_max_age = 200000000	# Maximum age before forced vacuum
autovacuum_multixact_freeze_max_age = 400000000
autovacuum_vacuum_cost_delay = 20ms	# Cost-based vacuum delay
autovacuum_vacuum_cost_limit = 200	# Cost limit for autovacuum

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------

# Statement Behavior
default_transaction_isolation = 'read committed'
default_transaction_read_only = off
default_transaction_deferrable = off
session_replication_role = 'origin'
statement_timeout = 30000		# 30 second statement timeout
lock_timeout = 30000			# 30 second lock timeout
idle_in_transaction_session_timeout = 60000	# 1 minute idle timeout

# Locale and Formatting
TimeZone = 'UTC'
timezone_abbreviations = 'Default'
extra_float_digits = 1
client_encoding = utf8

# Other Defaults
dynamic_library_path = '$libdir'
gin_fuzzy_search_limit = 0

#------------------------------------------------------------------------------
# LOCK MANAGEMENT
#------------------------------------------------------------------------------

deadlock_timeout = 1s
max_locks_per_transaction = 64		# Average number of locks per transaction

#------------------------------------------------------------------------------
# VERSION AND PLATFORM COMPATIBILITY
#------------------------------------------------------------------------------

# - PostgreSQL Upgrades -

# - Other Platforms and Clients -

#------------------------------------------------------------------------------
# ERROR HANDLING
#------------------------------------------------------------------------------

restart_after_crash = on		# Reinitialize after backend crash

#------------------------------------------------------------------------------
# CUSTOMIZED OPTIONS
#------------------------------------------------------------------------------

# Custom settings for AI Screening Application
# These are optimized for typical screening workload patterns

# Increase work_mem for sorting operations common in screening queries
# work_mem = 8MB

# Enable parallel queries for large screening operations
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Optimize for mixed read/write workload typical of screening apps
random_page_cost = 1.1		# Lower for SSD storage
effective_io_concurrency = 200	# Higher for SSD storage

# Better statistics for text search operations (common in screening)
default_statistics_target = 500

# Enable JIT compilation for complex queries
jit = on
jit_above_cost = 100000
jit_optimize_above_cost = 500000
jit_inline_above_cost = 500000
