[instance_name]
instance_name = ${HOSTNAME}

[database]
type = sqlite3
path = grafana.db

[security]
admin_user = admin
admin_password = ${ADMIN_PASSWORD}
secret_key = ${SECRET_KEY}

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth]
disable_login_form = false
disable_signout_menu = false

[auth.anonymous]
enabled = false

[server]
protocol = http
http_addr =
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false
router_logging = false
enable_gzip = true
static_root_path = public

[dataproxy]
logging = true
timeout = 30
send_user_header = false

[analytics]
reporting_enabled = false
check_for_updates = false

[panels]
enable_alpha = false

[metrics]
enabled = true
interval_seconds = 10

[metrics.graphite]
address =
prefix = prod.grafana.%(instance_name)s.

[grafana_net]
url = https://grafana.net

[smtp]
enabled = false

[emails]
welcome_email_on_sign_up = false

[log]
mode = console file
level = info

[log.console]
level = info

[log.file]
level = info
log_rotate = true
max_lines = 1000000
max_size_shift = 28
daily_rotate = true
max_days = 7

[alerting]
enabled = true
execute_alerts = true
error_or_timeout = alerting
nodata_or_nullvalues = no_data

[alerting.contact_points]
expire = 720h

[unified_alerting]
disabled_orgs =
min_interval = 10s

[feature_toggles]
enable = publicDashboards
