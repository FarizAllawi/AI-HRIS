services:
  # FastAPI App
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: fastapi-dev
    ports:
      - "8100:8100"
    environment:
      - ENV=development
    volumes:
      - ./app:/app
    command: >
      uvicorn app.main:app 
      --host 0.0.0.0 
      --port 8100 
      --reload 
      --log-level=info
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: celery
    container_name: screening-celery
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONPATH: /app
      DATABASE_URL: sqlite:///data/dev.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./uploads:/app/uploads
    depends_on:
      - redis
    networks:
      - backend
    restart: unless-stopped

  # Celery Flower
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: flower
    container_name: screening-flower
    command: >
      celery -A app.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
      - celery-worker
    networks:
      - backend
    restart: unless-stopped

  # Redis
  redis:
    image: redis:alpine
    container_name: fastapi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  redis_data:
